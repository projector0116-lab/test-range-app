            --border-light: #d2d2d7;
            --card-header-bg: #e8f1fc;
            --alert-yellow: #e6b800;
        }
        body {

        }
        
        /* 💡 ヘッダーの文字を丸ごと包み込む青い帯（トップバー） */
        .top-navbar-band {
            width: 100%; 
            background-color: var(--top-dark-blue); 
            padding: 15px 20px; 
            box-sizing: border-box;
            color: #ffffff;
        }
        .header-content-inner {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .header-title h1 { margin: 0; font-size: 20px; font-weight: 700; color: #ffffff; }
        .header-title p { margin: 4px 0 0 0; font-size: 13px; color: rgba(255, 255, 255, 0.8); }
        .header-right { text-align: right; font-size: 11px; color: rgba(255, 255, 255, 0.7); line-height: 1.4; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        .top-meta { font-size: 11px; color: var(--text-gray); margin-bottom: 8px; }
        .alert-text { color: var(--alert-yellow); font-size: 12px; margin-bottom: 12px; font-weight: bold; min-height: 18px; }
        
        /* 上下タブボタン */
        .info-banner { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .banner-box { border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden; cursor: pointer; background-color: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .banner-box .banner-title { padding: 10px 14px; font-weight: 700; font-size: 14px; color: var(--text-dark); background-color: #ffffff; border-bottom: 1px solid #f0f0f5; }
        .banner-box .banner-body { padding: 12px 14px; font-size: 12px; color: var(--text-gray); background-color: #ffffff; }
        
        .banner-box.active { border-color: transparent; background: var(--blue-gradient); box-shadow: 0 4px 10px rgba(0,112,224,0.2); }
        .banner-box.active .banner-title { background: transparent; color: #ffffff; border-bottom-color: transparent; }
        .banner-box.active .banner-body { background: transparent; color: rgba(255,255,255,0.9); }
        
        .update-row { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .update-btn { background: #ffffff; border: 1px solid var(--border-light); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--primary-blue); transition: all 0.1s; }
        .update-btn:active { background: rgba(255, 255, 255, 0.6) !important; opacity: 0.6; }
        .update-btn.loading-state { background: rgba(255, 255, 255, 0.6); opacity: 0.7; color: var(--text-gray); }
        
        .btn-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .btn { padding: 6px 18px; border: 1px solid var(--btn-border); background-color: #ffffff; color: var(--primary-blue); border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 13px; }
        .btn.active { background-color: var(--primary-blue); color: #ffffff; }
        .instruction-label { font-size: 12px; color: var(--text-gray); margin-bottom: 8px; }
        .scope-header-title { font-size: 15px; font-weight: 700; color: var(--primary-blue); margin: 20px 0 12px 0; padding-bottom: 4px; border-bottom: 1px dashed var(--border-light); }
        .cards-grid { display: flex; flex-direction: column; gap: 14px; width: 100%; }
        .subject-card { border: 1px solid var(--border-light); border-radius: 6px; background-color: #ffffff; overflow: hidden; box-sizing: border-box; width: 100%; }
        .card-header { background-color: var(--card-header-bg); padding: 8px 14px; font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--border-light); color: var(--text-blue); }
        .card-body { padding: 12px 14px; }
        .topic-row { margin-bottom: 12px; }
        .topic-row:last-child { margin-bottom: 0; }
        .topic-name { font-weight: 700; font-size: 13px; color: var(--text-dark); }
        .topic-pages { font-size: 11px; color: var(--text-gray); margin-top: 2px; }
        .status-unconfirmed { color: #86868b; font-size: 12px; }
        .view-section { display: none; }

        @media (max-width: 600px) { .info-banner { grid-template-columns: 1fr; } }

            { sub: "社会", items: [{ n: "A 江戸時代（寛政の改革～天保の改革）", p: "歴史Ⅱ P52～63" }, { n: "B 欧米の発展", p: "歴史Ⅱ P64～81" }, { n: "C 江戸時代（日本の開国）", p: "歴史Ⅱ P82～87" }, { n: "D 九州地方", p: "地理Ⅱ P78～89" }, { n: "E 中国・四国地方", p: "地理Ⅱ P90～101" }, { n: "F 近畿地方", p: "地理Ⅱ P102～115" }, { n: "G 中部地方", p: "地理Ⅱ P116～129" }, { n: "H 関東地方", p: "地理Ⅱ P130～143" }]},
            { sub: "国語", items: [{ n: "A モアイは語る", p: "さなる式 P98～100、108～109" }, { n: "B 平家物語", p: "さなる式 P112～114、124～125" }, { n: "C 仁和寺にある法師", p: "さなる式 P118、125" }, { n: "D 漢詩の風景", p: "さなる式 P122～123、125" }]}
        ],
        3: [
            { sub: "英語", items: [{ n: "A Let's Read 1", p: "さなる式① P80～93" }, { n: "B Unit4", p: "さなる式② P4～31" }, { n: "C Unit5", p: "さなる式② P34～63" }, { n: "D Unit6", p: "さなる式② P66～93" }]},
            { sub: "数学", items: [{ n: "A 二次関数（グラフ～変化の割合）", p: "さなる式② p5～p28" }, { n: "B 二次関数（応用）", p: "さなる式② p29～p50" }, { n: "C 相似な図形（相似と相似比～平行線と比まで）", p: "さなる式② p57～p84" }, { n: "D 相似な図形（角の二等分線～面積比・体積比）", p: "さなる式② p85～p106" }]},
            { sub: "理科", items: [{ n: "A 力がはたらく運動・力がはたらかない運動・慣性・力をおよぼし合う運動", p: "さなる式 P32～50" }, { n: "B 仕事", p: "さなる式 P56～67" }, { n: "C 力学的エネルギーの保存・エネルギーの移り変わり", p: "さなる式 P68～74、80～86" }, { n: "D 太陽の動き・星の動き", p: "さなる式 P180～194" }, { n: "E 四季の星座・季節の変化", p: "さなる式 P195～208" }, { n: "F 太陽と月・太陽系と銀河系", p: "さなる式 P214～228" }]},
            { sub: "社会", items: [{ n: "A 基本的人権", p: "歴史Ⅲ・公民 P102～115" }, { n: "B 選挙と政党・国会", p: "歴史Ⅲ・公民 P116～129" }, { n: "C 内閣・裁判所・三権分立", p: "歴史Ⅲ・公民 P130～143" }, { n: "D 地方自治", p: "歴史Ⅲ・公民 P144～155" }, { n: "E 家計・消費・流通", p: "歴史Ⅲ・公民 P156～167" }]},
            { sub: "国語", items: [{ n: "A 故郷", p: "さなる式 P80～83、86～89、100～101" }, { n: "B 初恋", p: "さなる式 P115、118～119" }, { n: "C 君待つと", p: "さなる式 P121、125～127" }, { n: "D 夏草", p: "さなる式 P131～135" }]}
        ]
    };
    let currentGrade = 1;
    let currentSchool = "nagakute";
    let activeTab = "default";

    function triggerScopeUpdateAnimation() {
        const btn = document.getElementById('trigger-update-action');
        const alertTxt = document.getElementById('alert-text-message');
        
        btn.classList.add('loading-state');
        btn.disabled = true;
        alertTxt.innerText = "最新の範囲を確認しています…";
        
        setTimeout(() => {
            btn.classList.remove('loading-state');
            btn.disabled = false;
            alertTxt.innerText = "最新の保存内容を表示しています。";
        }, 1500);
    }

    function switchMainTab(tabName) {
        activeTab = tabName;
        document.querySelectorAll('.banner-box').forEach(box => box.classList.remove('active'));
        document.getElementById('section-default-view').classList.remove('active-view');
        document.getElementById('section-table-view').classList.remove('active-view');

        if (tabName === 'default') {
            document.getElementById('tab-box-default').classList.add('active');
            document.getElementById('section-default-view').classList.add('active-view');
            renderScope();
        } else {
            document.getElementById('tab-box-table').classList.add('active');
            document.getElementById('section-table-view').classList.add('active-view');
            renderTableView();
        }
    }

    function changeGrade(grade) {
        currentGrade = grade;
        document.querySelectorAll('[id^="g-btn-"]').forEach(btn => btn.classList.remove('active'));
        document.getElementById('g-btn-' + grade).classList.add('active');
        currentSchool = (grade === 3) ? "nagoya" : "nagakute";
        renderSchoolButtons();
        if (activeTab === 'default') renderScope();
        else renderTableView();
    }

    function renderSchoolButtons() {
        const container = document.getElementById('school-buttons-container');
        container.innerHTML = "";
        const schools = database[currentGrade];
        if(!schools) return;
        Object.keys(schools).forEach(key => {
            const btn = document.createElement('button');
            btn.className = "btn" + (key === currentSchool ? " active" : "");
            btn.innerText = schools[key].name;
            btn.onclick = () => {
                currentSchool = key;
                container.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderScope();
            };
            container.appendChild(btn);
        });
    }

    function createCardHTML(card) {
        const cardEl = document.createElement('div');
        cardEl.className = "subject-card";
        let contentHtml = "";
        if (card.unconfirmed) {
            contentHtml = `<span class="status-unconfirmed">未決定</span>`;
        } else {
            card.items.forEach(item => {
                if (item.isSpecialRow) {
                    contentHtml += `<div class="topic-row" style="margin-top: 10px;"><div class="topic-name">${item.n}</div><div class="topic-pages" style="font-size:13px; color:var(--text-dark); margin:0;">${item.p}</div></div>`;
                } else {
                    contentHtml += `<div class="topic-row">${item.n ? `<div class="topic-name">${item.n}</div>` : ''}${item.p ? `<div class="topic-pages">${item.p}</div>` : ''}</div>`;
                }
            });
        }
        cardEl.innerHTML = `<div class="card-header">${card.sub}</div><div class="card-body">${contentHtml}</div>`;
        return cardEl;
    }

    function renderScope() {
        const schoolData = database[currentGrade][currentSchool];
        document.getElementById('scope-title-output').innerText = `${schoolData.name} ${currentGrade}年生のテスト範囲`;
        const grid = document.getElementById('cards-grid-output');
        grid.innerHTML = "";
        schoolData.scope.forEach(card => grid.appendChild(createCardHTML(card)));
    }

    function renderTableView() {
        document.getElementById('table-title-output').innerText = `${currentGrade}年生 共通範囲表`;
        const grid = document.getElementById('table-grid-output');
        grid.innerHTML = "";
        const listData = tableDatabase[currentGrade];
        if (!listData || listData.length === 0) {
            grid.innerHTML = `<div class="status-unconfirmed" style="padding:20px;">データがありません。</div>`;
            return;
        }
        listData.forEach(card => grid.appendChild(createCardHTML(card)));
    }

    changeGrade(1);
</script>
</body>
</html>
